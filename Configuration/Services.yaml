services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  WebentwicklerAt\OpenidConnect\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'

  WebentwicklerAt\OpenidConnect\EventListener\ProcessRequestTokenListener:
    tags:
      - name: event.listener
        identifier: 'openid-connect'
        event: TYPO3\CMS\Core\Authentication\Event\BeforeRequestTokenProcessedEvent
